name: CI/CD Quality & Build Check

# Gate A–E (locale: npm run gate). Gate F–H richiedono SDK/emulatore e restano fuori CI.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Gates A-E (format lint typecheck test coverage)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm run mobile:install

      - name: 'Gate A — Formatter Check'
        run: npm run format:check

      - name: 'Gate B — Linter'
        run: npm run lint

      - name: 'Gate C — Mobile Typecheck'
        run: npm run mobile:typecheck

      - name: 'Gate D — Mobile Tests'
        run: npm run mobile:test

      - name: 'Gate E — Mobile Test Coverage'
        run: npm run mobile:test:coverage
