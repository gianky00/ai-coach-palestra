appId: com.coemi.kinefit.elite
---
# Richiede credenziali di test:
# MAESTRO_TEST_EMAIL e MAESTRO_TEST_PASSWORD nell'ambiente

- launchApp
- tapOn:
    id: auth-email-input
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: auth-password-input
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    id: auth-submit-button
- extendedWaitUntil:
    visible:
      id: tab-oggi
    timeout: 15000
- assertVisible:
    id: tab-oggi
