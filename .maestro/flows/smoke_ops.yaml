appId: com.coemi.kinefit.elite
---
# Ops smoke: modali + timer rest presets senza login / senza Garmin OAuth
# Policy: tap UI only — non inviare form, non avviare OAuth, non usare alarmManager

- openLink: 'kinefit://smoke/tabs?tab=profilo'
- extendedWaitUntil:
    visible:
      id: screen-profile
    timeout: 20000
- assertVisible:
    id: profile-settings-row
- tapOn:
    id: profile-settings-row
- extendedWaitUntil:
    visible:
      id: modal-settings
    timeout: 15000
- assertVisible: 'Impostazioni'
- assertVisible:
    id: settings-section-allenamento
- assertVisible:
    id: settings-section-sistema
- assertVisible:
    id: settings-units-row
- assertVisible:
    id: settings-version
- tapOn:
    id: settings-close-button
- extendedWaitUntil:
    visible:
      id: screen-profile
    timeout: 15000

- openLink: 'kinefit://smoke/tabs?tab=profilo'
- extendedWaitUntil:
    visible:
      id: profile-garmin-row
    timeout: 20000
- tapOn:
    id: profile-garmin-row
- extendedWaitUntil:
    visible:
      id: modal-garmin
    timeout: 15000
- assertVisible: 'Garmin Connect'
- tapOn:
    id: garmin-close-button
- extendedWaitUntil:
    visible:
      id: screen-profile
    timeout: 15000

- openLink: 'kinefit://smoke/tabs?tab=oggi'
- extendedWaitUntil:
    visible:
      id: screen-oggi
    timeout: 20000
- assertVisible:
    id: oggi-streak-chip
- tapOn:
    id: oggi-add-exercise
- extendedWaitUntil:
    visible:
      id: modal-add-exercise
    timeout: 15000
- assertVisible: 'Nuovo Esercizio'
- assertVisible:
    id: add-exercise-name-input
- tapOn:
    id: add-exercise-close-button
- extendedWaitUntil:
    visible:
      id: screen-oggi
    timeout: 15000

# FloatingTimer via smoke deep-link (ticks freeze in smoke for uiautomator)
- openLink: 'kinefit://smoke/tabs?tab=oggi&timer=90'
- extendedWaitUntil:
    visible:
      id: floating-timer
    timeout: 20000
- assertVisible:
    id: timer-display
- assertVisible:
    id: timer-minus-15
- assertVisible:
    id: timer-plus-15
- assertVisible:
    id: timer-rest-presets
- assertVisible:
    id: timer-rest-preset-90
- tapOn:
    id: timer-close
- extendedWaitUntil:
    visible:
      id: screen-oggi
    timeout: 15000

- openLink: 'kinefit://smoke/tabs?tab=storico'
- extendedWaitUntil:
    visible:
      id: screen-history
    timeout: 20000
- assertVisible:
    id: history-search-input
- assertVisible:
    id: history-export-button
- assertVisible:
    id: history-session-hint
